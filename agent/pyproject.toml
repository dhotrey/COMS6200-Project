[project]
name = "network-agent"
version = "0.1.0"
description = "A small conversational network troubleshooting harness"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "logfire[httpx]>=3", "python-dotenv>=1"]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
